; 按键硬件最小测试 Project
; 用法: 在 MCU_design 目录下运行
;   pio run -d test/test_buttons -t upload
;   pio device monitor -d test/test_buttons

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
