# Cloudflare Worker — 搜索代理
# 部署：npx wrangler deploy
name = "desktoppet-search"
main = "worker.js"

# 兼容日期标志（免费计划推荐）
compatibility_date = "2025-06-01"

# 路由（可选：绑定自定义域名）
# routes = [{ pattern = "search.yourdomain.com/*", zone_name = "yourdomain.com" }]

# 环境变量（如有需要）
# [vars]
# API_KEY = "xxx"

# 免费计划限制注意事项：
# - 每天 10 万次请求
# - 每次 CPU 时间不超过 10ms
